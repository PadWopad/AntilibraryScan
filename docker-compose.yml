version: '3.8'

services:
  # --- SurrealDB (Local Database) ---
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: surrealdb
    user: root
    command: start --log trace --user root --pass root file://data/database.db
    ports:
      - "8000:8000"
    volumes:
      - ./surreal_data:/data
    restart: always

  # --- Coincidence Laboratory App ---
  antilibrary:
    build: .
    container_name: antilibrary
    depends_on:
      - surrealdb
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=your_gemini_api_key_here
      # SurrealDB Config
      - VITE_SURREAL_URL=http://surrealdb:8000/rpc
      - VITE_SURREAL_USER=root
      - VITE_SURREAL_PASS=root
      - VITE_SURREAL_NS=antilibrary
      - VITE_SURREAL_DB=antilibrary
